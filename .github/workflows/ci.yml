name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type-check is the enforced gate — it catches the class of regressions
      # (wrong types, bad refactors) that broke us before.
      - name: Type-check
        run: npm run typecheck

      # Lint runs for visibility but is non-blocking for now: the repo carries
      # pre-existing react-hooks (React Compiler) findings in a few client
      # pages that need a data-fetching refactor to resolve. Flip this to a hard
      # gate once those are cleared.
      - name: Lint
        run: npm run lint
        continue-on-error: true
